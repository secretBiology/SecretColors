{% set name = "SecretColors" %}
{% set version = "2.0.0" %}
{% set python_min = python_min | default("3.10") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: SHA256_PLACEHOLDER

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling >=1.27
  run:
    - python >={{ python_min }}
  run_constrained:
    - matplotlib-base >=3.10

test:
  imports:
    - SecretColors
    - SecretColors.cmaps
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/secretBiology/SecretColors
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'A small package for fantastic color palette'
  description: Library generated for making plots with better color palette. It uses famous color palettes and adds few helpful functions.
  doc_url: https://secretcolors.readthedocs.io/
  dev_url: https://github.com/secretBiology/SecretColors

extra:
  recipe-maintainers:
    - rohitsuratekar
