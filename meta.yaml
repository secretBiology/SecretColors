{% set name = "SecretColors" %}
{% set version = "2.0.0" %}
{% set python_min = python_min | default("3.10") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: ca6a1084a18a9d44bfcd6a3ba3e067a130c4355fa17a781dbe96f89fe4937e83

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling >=1.27
  run:
    - python >={{ python_min }}
  run_constrained:
    - matplotlib-base >=3.10
    - pillow >=11.0

test:
  imports:
    - SecretColors
    - SecretColors.cmaps
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/secretBiology/SecretColors
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Color palettes, colormaps and accessible colors for Python'
  description: |
    Ready-to-use palettes (IBM, Material, Adobe Spectrum, ColorBrewer, Tableau ...),
    83 matplotlib colormaps, colorblind-safe color selection, WCAG contrast checks
    and color science utilities (CIE Lab, Delta E).
  doc_url: https://secretcolors.readthedocs.io/
  dev_url: https://github.com/secretBiology/SecretColors

extra:
  recipe-maintainers:
    - rohitsuratekar
